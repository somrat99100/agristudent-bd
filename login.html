<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://lh3.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://api.cloudinary.com; frame-src 'none'; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="manifest.json">
<title>Login — AgriStudent BD</title>
<script src="js/auth-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="js/navbar-loader.js"></script>

<section class="section-page">
  <div class="container" style="max-width:460px;">
    <div class="crumb"><a href="index.html">Home</a> / Login</div>
    <h1>🔐 Log In</h1>
    <p style="color:var(--moss-600);margin-bottom:2rem;">
      Enter the email and Student ID you registered with. No password needed —
      we look you up by your registration record.
    </p>

    <form id="login-form" style="display:flex;flex-direction:column;gap:1.1rem;">
      <div>
        <label for="login-email" style="display:block;font-weight:600;margin-bottom:.3rem;">Email Address *</label>
        <input type="email" id="login-email" required autocomplete="email"
               style="width:100%;padding:.7rem .9rem;border:1px solid var(--line);border-radius:8px;font-family:var(--font-body);font-size:.95rem;">
      </div>

      <div>
        <label for="login-studentId" style="display:block;font-weight:600;margin-bottom:.3rem;">Student ID Number *</label>
        <input type="text" id="login-studentId" required placeholder="e.g., 21-AGR-045"
               style="width:100%;padding:.7rem .9rem;border:1px solid var(--line);border-radius:8px;font-family:var(--font-body);font-size:.95rem;">
      </div>

      <button type="submit" id="login-submit" style="background:var(--moss-700);color:#fff;border:none;padding:.85rem;border-radius:8px;font-weight:600;font-size:1rem;cursor:pointer;">Log In</button>

      <div id="login-status" class="hidden" style="text-align:center;font-size:.9rem;font-weight:600;"></div>
    </form>

    <p style="margin-top:1.6rem;color:var(--moss-600);font-size:.9rem;text-align:center;">
      Not registered yet? <a href="register.html" style="color:var(--leaf-500);font-weight:600;">Register here →</a>
    </p>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom">© AgriStudent BD — All Rights Reserved.</div>
  </div>
</footer>

<script type="module" src="js/login.js"></script>
<script type="module" src="js/session.js"></script>
<script src="js/main.js"></script>
</body>
</html>
