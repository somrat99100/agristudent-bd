<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com https://res.cloudinary.com https://lh3.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firebasestorage.googleapis.com https://securetoken.googleapis.com https://res.cloudinary.com; frame-src 'none'; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="manifest.json">
<title>Viewing Resource — Agri Core</title>
<script src="js/auth-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="viewer-layout" oncontextmenu="return false;">

<div id="loading-mask" class="loading-mask">
  <div class="loading-spinner"></div>
  <div class="loading-text">Preparing Document...</div>
</div>

<div class="viewer-bar">
  <a href="javascript:history.back()" class="back-link">← Back</a>
  <span class="title" id="viewer-title">Loading…</span>
  <div class="viewer-controls">
    <span id="zoom-display" class="zoom-display">100%</span>
    <span id="image-size-display" class="size-display" style="display:none;"></span>
  </div>
</div>

<div class="viewer-bg">
  <div class="viewer-book">
    <div class="viewer-frame-wrap" id="viewer-frame-wrap" title="Double-tap or pinch to magnify">
      <button id="btn-side-prev" class="side-nav-btn side-prev" style="display:none;" disabled>◀</button>
      <button id="btn-side-next" class="side-nav-btn side-next" style="display:none;">▶</button>
    </div>
    <div class="book-controls" id="book-controls" style="display:none;">
      <button id="btn-prev" class="book-btn" disabled>◀ Prev</button>
      <div class="page-indicator">
        Page <input type="number" id="page-input" class="page-search-input" value="0" min="1"> of <span id="page-count">0</span>
        <button id="btn-go" class="btn-go">Go</button>
      </div>
      <button id="btn-next" class="book-btn">Next ▶</button>
    </div>
    <div class="viewer-image-caption" id="viewer-image-caption" style="display:none;">
      <span class="caption-code" id="caption-code"></span>
      <span class="caption-title" id="caption-title"></span>
    </div>
    <div class="viewer-fallback-bar" id="viewer-fallback-bar" style="display:none;">
      Presentation not displaying correctly? <a id="fallback-open-link" href="#" target="_blank" rel="noopener">Open the original file</a>
    </div>
  </div>
</div>

<div class="owner-badge hidden" id="owner-badge"></div>

<div class="viewer-watermark" id="viewer-watermark"></div>

<script src="js/view.js"></script>
</body>
</html>
