<!-- ======================================================
     SECURITY META TAGS — reference for pages served outside Firebase Hosting.
     Firebase Hosting sends the authoritative CSP/security headers from
     firebase.json; this file is kept in sync as a local fallback template.
     ====================================================== -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://lh3.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://firebasestorage.googleapis.com https://securetoken.googleapis.com https://us-central1-agristudent-bd.cloudfunctions.net; frame-src 'none'; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'self';">
